
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apple Pay Sandbox Test</title>

<script crossorigin
src="https://applepay.cdn-apple.com/jsapi/1.latest/apple-pay-sdk.js">
</script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f5f5f7;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.container{
  width:min(90%,400px);
  background:white;
  padding:30px;
  border-radius:24px;
  box-shadow:0 12px 40px #00000012;
  text-align:center;
}
h1{font-size:25px}
.price{
  font-size:42px;
  font-weight:700;
  margin:25px 0;
}
apple-pay-button{
  --apple-pay-button-width:100%;
  --apple-pay-button-height:52px;
  --apple-pay-button-border-radius:12px;
}
#result{
  margin-top:20px;
  font-size:15px;
}
.note{
  color:#777;
  font-size:12px;
  margin-top:20px;
}
</style>
</head>

<body>
<div class="container">
  <h1>Test Apple Pay</h1>
  <p>Paiement de démonstration</p>
  <div class="price">1,00 €</div>

  <apple-pay-button
    buttonstyle="black"
    type="plain"
    locale="fr-FR"
    onclick="startApplePay()">
  </apple-pay-button>

  <div id="result" role="status"></div>
  <p class="note">
    Apple Pay Sandbox — Aucun débit réel.
  </p>
</div>

<script>
const MERCHANT_ID = "merchant.example.test";
const VALIDATION_ENDPOINT = "/api/validate-merchant";

function showResult(message,color="#333"){
  const el=document.getElementById("result");
  el.textContent=message;
  el.style.color=color;
}

function startApplePay(){
  if(!window.ApplePaySession ||
     !ApplePaySession.canMakePayments()){
    showResult("Apple Pay indisponible sur cet appareil.","red");
    return;
  }

  const request={
    countryCode:"FR",
    currencyCode:"EUR",
    supportedNetworks:["visa","masterCard","amex"],
    merchantCapabilities:["supports3DS"],
    total:{
      label:"Paiement Sandbox",
      amount:"1.00",
      type:"final"
    }
  };

  let session;

  try{
    session=new ApplePaySession(3,request);
  }catch(e){
    showResult("Impossible de démarrer Apple Pay.","red");
    return;
  }

  session.onvalidatemerchant=async(event)=>{
    try{
      const response=await fetch(VALIDATION_ENDPOINT,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          validationURL:event.validationURL
        })
      });

      if(!response.ok) throw new Error("Validation impossible");

      const merchantSession=await response.json();
      session.completeMerchantValidation(merchantSession);

    }catch(e){
      showResult("Validation marchande indisponible.","red");
      session.abort();
    }
  };

  session.onpaymentauthorized=(event)=>{
    // Simulation d'un échec en environnement sandbox.
    // Aucun jeton de paiement n'est envoyé à un processeur.
    session.completePayment(
      ApplePaySession.STATUS_FAILURE
    );
    showResult("Paiement de test refusé.","#e53935");
  };

  session.oncancel=()=>{
    showResult("Paiement annulé.");
  };

  session.begin();
}
</script>
</body>
</html>
