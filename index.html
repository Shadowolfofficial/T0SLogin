
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#090b12">

  <!-- Référencement Google -->
  <title>ThunderOs</title>

  <meta name="description"
        content="Découvrez ThunderOs, un système d'exploitation en ligne gratuit avec une interface moderne, des applications et un navigateur intégré. Lancez ThunderOs directement depuis votre navigateur.">

  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">

  <!-- Réseaux sociaux -->
  <meta property="og:title"
        content="ThunderOs">

  <meta property="og:description"
        content="Découvrez ThunderOs, un système d'exploitation en ligne gratuit, moderne et accessible depuis votre navigateur.">

  <meta property="og:type" content="website">

  <style>
    :root {
      --bg: #090b12;
      --text: #f7f8ff;
      --muted: #9299ad;
      --accent: #7185ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }

    .container {
      width: 90%;
      max-width: 350px;
      text-align: center;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        #7185ff,
        #3044b8
      );
      font-size: 36px;
      font-weight: 800;
      box-shadow: 0 8px 25px #4059ff25;
    }

    h1 {
      margin: 0;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .subtitle {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .progress {
      height: 4px;
      width: 100%;
      max-width: 245px;
      margin: 30px auto 14px;
      background: #252a3a;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: var(--accent);
      border-radius: inherit;
      transform: translateX(-100%);
      animation: loading .5s linear forwards;
    }

    .status {
      color: #858da4;
      font-size: 12px;
    }

    footer {
      position: fixed;
      bottom: 22px;
      color: #626a7e;
      font-size: 11px;
    }

    @keyframes loading {
      to {
        transform: translateX(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-bar {
        animation: none;
        transform: none;
      }
    }
  </style>

  <script>
    (function () {
      "use strict";

      const exp = Date.now() + 60000;

      const random = new Uint32Array(1);
      crypto.getRandomValues(random);

      const token = btoa(
        exp + "-" + random[0]
      );

      const destination = new URL(
        "https://t0s.pages.dev/"
      );

      destination.searchParams.set("tok", token);
      destination.searchParams.set("exp", exp);

      // Redirection après 500 millisecondes
      setTimeout(function () {
        window.location.replace(destination.href);
      }, 500);

    })();
  </script>
</head>

<body>

  <main class="container">

    <div class="logo" aria-hidden="true">
      T
    </div>

    <h1>ThunderOs</h1>

    <p class="subtitle">
      Préparation de votre espace numérique...
    </p>

    <div class="progress"
         role="progressbar"
         aria-label="Chargement de ThunderOS">
      <div class="progress-bar"></div>
    </div>

    <div class="status">
      Connexion à ThunderOs...
    </div>

  </main>

  <footer>
    © ThunderOs · Tous droits réservés
  </footer>

</body>
</html>
