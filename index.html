<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b12">
<title>ThunderOS — Chargement</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #090b12;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #090b12;
  color: #f7f8ff;
  font-family: -apple-system, BlinkMacSystemFont,
               "Segoe UI", Arial, sans-serif;
  overflow: hidden;
}

.container {
  width: 90%;
  max-width: 340px;
  text-align: center;
}

.logo {
  width: 68px;
  height: 68px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  border-radius: 19px;
  background: linear-gradient(135deg, #7185ff, #3044b8);
  font-size: 35px;
  font-weight: 800;
  box-shadow: 0 8px 25px #4059ff25;
}

h1 {
  margin: 0;
  font-size: 27px;
  font-weight: 750;
  letter-spacing: -1px;
}

.subtitle {
  margin: 10px 0 0;
  color: #9299ad;
  font-size: 13px;
}

.progress {
  height: 4px;
  width: 100%;
  max-width: 240px;
  margin: 30px auto 13px;
  background: #252a3a;
  border-radius: 20px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  width: 100%;
  background: #7185ff;
  border-radius: 20px;
  transform: translateX(-100%);
  animation: loading .5s linear forwards;
}

.status {
  color: #7f879d;
  font-size: 12px;
}

footer {
  position: fixed;
  bottom: 20px;
  color: #555d71;
  font-size: 11px;
}

@keyframes loading {
  to {
    transform: translateX(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .progress-bar {
    animation: none;
    transform: none;
  }
}
</style>

<script>
(function () {
  "use strict";

  // Création du token
  const exp = Date.now() + 60000;
  const random = new Uint32Array(1);
  crypto.getRandomValues(random);

  const token = btoa(`${exp}-${random[0]}`);

  const destination = new URL("https://t0s.pages.dev/");
  destination.searchParams.set("tok", token);
  destination.searchParams.set("exp", exp);

  // Redirection rapide, sans attendre window.onload
  setTimeout(function () {
    window.location.replace(destination.href);
  }, 500);
})();
</script>
</head>

<body>

<main class="container">
  <div class="logo">T</div>

  <h1>ThunderOS</h1>

  <p class="subtitle">
    Préparation de votre espace...
  </p>

  <div class="progress" aria-label="Chargement">
    <div class="progress-bar"></div>
  </div>

  <div class="status">
    Connexion en cours...
  </div>
</main>

<footer>
  © ThunderOS
</footer>

</body>
</html>
